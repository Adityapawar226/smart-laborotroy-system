<!DOCTYPE html>
<html>
<head>

<title>Add Test</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fb;
}

.container{
    width:700px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select,
textarea{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;

}

textarea{
    resize:vertical;
}

.readonly{
    background:#f3f4f6;
}

.buttons{
    margin-top:25px;
}

button,
a{

    padding:12px 30px;
    border:none;
    border-radius:5px;
    text-decoration:none;
    cursor:pointer;

}

.save{
    background:#1677ff;
    color:white;
}

.cancel{
    background:#6c757d;
    color:white;
    margin-left:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Add New Laboratory Test</h2>

<form method="POST">

<label>Department</label>
<input
type="text"
value="{{ department.department_name }}"
readonly
class="readonly">

<label>Test Code</label>
<input
type="text"
name="test_code"
value="{{ test_code }}"
readonly
class="readonly">

<label>Test Name</label>
<input
type="text"
name="test_name"
required>

<label>Short Name</label>
<input
type="text"
name="short_name">

<label>Price (₹)</label>
<input
type="number"
step="0.01"
name="price"
required>

<label>Sample Type</label>

<select name="sample_type">

<option value="Blood">Blood</option>
<option value="Serum">Serum</option>
<option value="Plasma">Plasma</option>
<option value="Urine">Urine</option>
<option value="Stool">Stool</option>
<option value="CSF">CSF</option>
<option value="Whole Blood">Whole Blood</option>

</select>

<label>Report Time</label>

<select name="report_time">

<option>Same Day</option>
<option>24 Hours</option>
<option>48 Hours</option>
<option>72 Hours</option>

</select>

<label>Description</label>

<textarea
rows="4"
name="description"></textarea>

<div class="buttons">

<button
type="submit"
class="save">

💾 Save Test

</button>

<a
href="{{ url_for('test_builder.department_tests',
department_id=department.id) }}"
class="cancel">

Cancel

</a>

</div>

</form>

</div>

</body>
</html>
