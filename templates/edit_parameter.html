{% extends "base.html" %}

{% block title %}Edit Parameter{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Parameter</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Parameter Name</label>
                    <input
                        type="text"
                        name="parameter_name"
                        class="form-control"
                        value="{{ parameter[3] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Unit</label>
                    <input
                        type="text"
                        name="unit"
                        class="form-control"
                        value="{{ parameter[4] }}"
                        required>
                </div>

               <div class="mb-3">
    <label class="form-label">Reference Type</label>

    <select
        name="reference_type"
        id="reference_type"
        class="form-select">

        <option value="normal"
            {% if parameter[9]=='normal' %}selected{% endif %}>
            Normal Range
        </option>

        <option value="descriptive"
            {% if parameter[9]=='descriptive' %}selected{% endif %}>
            Descriptive
        </option>

        <option value="age"
            {% if parameter[9]=='age' %}selected{% endif %}>
            Age / Gender
        </option>

        <option value="formula"
            {% if parameter[9]=='formula' %}selected{% endif %}>
            Formula
        </option>

        <option value="none"
            {% if parameter[9]=='none' %}selected{% endif %}>
            No Reference
        </option>

    </select>
</div>

<div class="mb-3" id="referenceBox">

    <label class="form-label">Reference Range</label>

    <textarea
        id="reference_range"
        name="reference_range"
        rows="6"
        class="form-control">{{ parameter[5] }}</textarea>

</div>

                <button class="btn btn-success">
                    Update Parameter
                </button>

                <a href="{{ url_for('manage_parameters', test_id=test_id) }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>
<script>

const type=document.getElementById("reference_type");

const textarea=document.getElementById("reference_range");

const box=document.getElementById("referenceBox");

function updateReferenceUI(){

    if(type.value==="none"){

        box.style.display="none";

        return;
    }

    box.style.display="block";

    if(type.value==="normal"){

        textarea.placeholder="Example:\n4 - 11";

    }

    else if(type.value==="descriptive"){

        textarea.placeholder=
`Negative (<0.9)

Equivocal (0.9-1.1)

Positive (>1.1)`;

    }

    else if(type.value==="age"){

        textarea.placeholder=
`Children : 0.2 - 0.9

Men : 0.2 - 2.3

Women

Follicular : 0.2 - 1.3

Luteal : 1.0 - 4.5`;

    }

    else if(type.value==="formula"){

        textarea.placeholder=
`LDL = TC - HDL - TG/5`;

    }

}

updateReferenceUI();

type.addEventListener("change",updateReferenceUI);

</script>

{% endblock %}
